services:
  hadoop:
    build: ./hadoop
    container_name: hadoop
    volumes:
      - ./ventas_125053005.csv:/data/input/ventas_125053005.csv:ro
      - ./mapreduce:/home/hadoop/mapreduce
      - ./resultados:/data/output
      - sshkeys:/keys:ro
    networks:
      - datamart-net

  db:
    image: postgres:16
    container_name: db
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - datamart-net

  api:
    build: ./api
    container_name: api
    env_file: .env
    environment:
      DB_HOST: db
    ports:
      - "5000:5000"
    volumes:
      - ./resultados:/data/output:ro
      - ./scripts:/scripts:ro
      - sshkeys:/keys
    depends_on:
      db:
        condition: service_healthy
    networks:
      - datamart-net

networks:
  datamart-net:

volumes:
  pgdata:
  sshkeys:
